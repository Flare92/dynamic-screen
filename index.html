<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ritmo – la tua routine</title>
  <meta name="description" content="Il tuo piano di allenamento personalizzato in base a corpo, salute, abitudini e tempo a disposizione, con esercizi animati in 3D.">
  <meta name="theme-color" content="#05070a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ritmo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="grid"></div>
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="scan"></div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ecgGrad" x1="0" x2="1"><stop offset="0" stop-color="#5cf0ff" stop-opacity="0"/><stop offset=".5" stop-color="#5cf0ff"/><stop offset="1" stop-color="#c6ff3d"/></linearGradient>
      <linearGradient id="ringGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5cf0ff"/><stop offset="1" stop-color="#c6ff3d"/></linearGradient>
      <linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c6ff3d" stop-opacity=".28"/><stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/></linearGradient>
    </defs>
  </svg>

  <main id="app" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" hidden></nav>

  <div id="player" class="player" hidden role="dialog" aria-modal="true" aria-label="Allenamento guidato"></div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
